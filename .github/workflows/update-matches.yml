name: Update current-season matches

on:
  schedule:
    - cron: "30 9 * * *"  # 09:30 UTC daily (after FPL's 9AM UK bonus-points finalization cutoff)
  workflow_dispatch:        # allows manual runs from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch latest match results
        run: python scripts/update_matches.py

      - name: Fetch latest player ownership
        run: python scripts/update_ownership.py

      - name: Fetch latest player gameweek points
        run: python scripts/update_player_gameweeks.py

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- data/matches.csv data/ownership.csv data/player-gameweeks.csv; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/matches.csv data/ownership.csv data/player-gameweeks.csv
          git commit -m "Update matches.csv/ownership.csv/player-gameweeks.csv: $(date -u +%Y-%m-%d)"
          git push
